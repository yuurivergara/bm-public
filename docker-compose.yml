# Ambiente local de desenvolvimento. Nunca use dados reais de clientes aqui.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: bm_owner
      POSTGRES_PASSWORD: bm_owner
      POSTGRES_DB: bm
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bm_owner -d bm"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
volumes:
  pgdata:
  miniodata:
