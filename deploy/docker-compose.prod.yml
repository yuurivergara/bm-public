# Staging/produção na VPS via Coolify (D-16). A Coolify lê este arquivo do repositório
# (recurso "Docker Compose" com build pack de Git) e o Traefik dela faz HTTPS na frente da API.
#
# - Nenhuma porta publicada: Postgres só é acessível pela rede interna deste projeto.
# - A imagem vem do GHCR (publicada pelo workflow .github/workflows/deploy.yml).
# - Variáveis SERVICE_* são geradas pela Coolify na 1ª implantação (confirmado na v4.7.5).
#   MASTER_KEY e PHONE_HASH_PEPPER NÃO são geradas pela Coolify: gere-as você e guarde no cofre de
#   senhas, porque perdê-las torna irrecuperáveis os tokens Meta e os hashes de telefone.
# - Rollback: defina IMAGE_TAG=<sha do commit> nas variáveis da Coolify e reimplante.

services:
  api:
    image: ghcr.io/yuurivergara/bm-api:${IMAGE_TAG:-staging}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      # Domínio gerado pela Coolify, proxiado para a porta 3000. Troque no painel por https://...
      - SERVICE_FQDN_API_3000
      - APP_ENV=${APP_ENV:-staging}
      - PORT=3000
      - DATABASE_URL=postgres://bm_app:${SERVICE_PASSWORD_BMAPP}@bm-postgres:5432/bm
      - MASTER_KEY=${MASTER_KEY:?defina MASTER_KEY (32 bytes base64) na Coolify}
      - MASTER_KEY_ID=${MASTER_KEY_ID:-master-v1}
      - PHONE_HASH_PEPPER=${PHONE_HASH_PEPPER:?defina PHONE_HASH_PEPPER (32 bytes base64) na Coolify}
      - SESSION_COOKIE_SECURE=true
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Meta (docs/10-meta-referencia.md). Em staging, o override docker-compose.sim.yml
      # aponta META_GRAPH_BASE_URL para o meta-sim.
      - META_GRAPH_BASE_URL=${META_GRAPH_BASE_URL:-https://graph.facebook.com}
      - META_GRAPH_VERSION=${META_GRAPH_VERSION:-v27.0}
      - META_APP_ID=${META_APP_ID:-}
      - META_APP_SECRET=${META_APP_SECRET:?defina META_APP_SECRET (App Dashboard → Configurações → Básico)}
      - META_WEBHOOK_VERIFY_TOKEN=${META_WEBHOOK_VERIFY_TOKEN:?defina META_WEBHOOK_VERIFY_TOKEN (16+ caracteres)}
      # Arquivos de contatos enquanto são analisados (apagados depois); volume sobrevive a restart.
      - IMPORT_DIR=/data/imports
    volumes:
      - bm-imports:/data/imports
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/readyz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m

  # Executa as migrations e termina. A API só sobe se ele sair com código 0.
  migrate:
    image: ghcr.io/yuurivergara/bm-api:${IMAGE_TAG:-staging}
    pull_policy: ${PULL_POLICY:-always}
    restart: "no" # a Coolify exclui serviços com restart "no" do health check
    command: ["node", "node_modules/@bm/db/dist/cli.js", "migrate"]
    depends_on:
      bm-postgres:
        condition: service_healthy
    environment:
      - DATABASE_ADMIN_URL=postgres://bm_owner:${SERVICE_PASSWORD_POSTGRES}@bm-postgres:5432/bm
      - DATABASE_APP_PASSWORD=${SERVICE_PASSWORD_BMAPP}

  # Nome único de propósito: na rede "coolify", "postgres" é alias do banco interno da Coolify.
  # Imagem = postgres:16.14-bookworm + WAL-G (deploy/postgres). Tag pelo conteúdo: só recria quando muda.
  bm-postgres:
    image: ghcr.io/yuurivergara/bm-postgres:${PG_IMAGE_TAG:?defina PG_IMAGE_TAG (deploy/postgres/tag.sh)}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    # O padrão do Docker (64 MB) é pouco para vacuum/índices paralelos: "could not resize shared
    # memory segment … No space left on device" ao limpar 1M contatos no staging.
    shm_size: 256m
    # Backup contínuo: cada segmento de WAL vai cifrado para o destino; archive_timeout fecha um
    # segmento a cada 5 min no máximo (RPO ≤ 5 min, docs/02-arquitetura.md).
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - archive_mode=on
      - -c
      - archive_command=bm-wal-archive %p
      - -c
      - archive_timeout=300
    environment:
      - POSTGRES_USER=bm_owner
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - POSTGRES_DB=bm
      - &walg_key WALG_LIBSODIUM_KEY=${WALG_LIBSODIUM_KEY:?defina WALG_LIBSODIUM_KEY (openssl rand -base64 32) e guarde no cofre}
      - &walg_file WALG_FILE_PREFIX=${WALG_FILE_PREFIX:-}
      - &walg_s3 WALG_S3_PREFIX=${WALG_S3_PREFIX:-}
      - &aws_endpoint AWS_ENDPOINT=${AWS_ENDPOINT:-}
      - &aws_region AWS_REGION=${AWS_REGION:-}
      - &aws_key AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - &aws_secret AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - &aws_path AWS_S3_FORCE_PATH_STYLE=${AWS_S3_FORCE_PATH_STYLE:-}
    volumes:
      - bm-pgdata:/var/lib/postgresql/data
      - bm-backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bm_owner -d bm"]
      interval: 5s
      timeout: 5s
      retries: 20
    deploy:
      resources:
        limits:
          memory: 1g

  # Base diária, retenção, checagem do arquivamento e teste de restauração semanal (deploy/postgres/bm-backup).
  bm-backup:
    image: ghcr.io/yuurivergara/bm-postgres:${PG_IMAGE_TAG}
    pull_policy: ${PULL_POLICY:-always}
    restart: unless-stopped
    shm_size: 128m # o teste de restauração sobe um Postgres aqui dentro
    user: postgres
    command: ["bm-backup", "loop"]
    depends_on:
      bm-postgres:
        condition: service_healthy
    environment:
      - TZ=America/Sao_Paulo
      - PGHOST=bm-postgres
      - PGUSER=bm_owner
      - PGPASSWORD=${SERVICE_PASSWORD_POSTGRES}
      - PGDATABASE=bm
      - BACKUP_TIME=${BACKUP_TIME:-03:15}
      - BACKUP_VERIFY_WEEKDAY=${BACKUP_VERIFY_WEEKDAY:-7}
      - BACKUP_RETAIN_FULL=${BACKUP_RETAIN_FULL:-7}
      - BACKUP_PING_URL=${BACKUP_PING_URL:-}
      - *walg_key
      - *walg_file
      - *walg_s3
      - *aws_endpoint
      - *aws_region
      - *aws_key
      - *aws_secret
      - *aws_path
    volumes:
      # a base é lida direto dos arquivos (modo 1 do WAL-G); somente leitura
      - bm-pgdata:/var/lib/postgresql/data:ro
      - bm-backups:/backups
    deploy:
      resources:
        limits:
          memory: 512m

volumes:
  bm-pgdata:
  bm-imports:
  # Destino local (WALG_FILE_PREFIX=/backups): só enquanto não houver destino fora da VPS.
  bm-backups:
