# Override para rodar a pilha fora da Coolify, direto na VPS (mesmo padrão de /opt/vendra):
# a API entra na rede "coolify" e o Traefik da Coolify faz HTTPS (Let's Encrypt) pelo domínio.
# ROUTER_NAME separa os roteadores do Traefik de staging (bmapi) e produção (bmprod).
services:
  api:
    networks: [default, coolify]
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.${ROUTER_NAME:-bmapi}-https.redirectscheme.scheme=https
      - traefik.http.routers.${ROUTER_NAME:-bmapi}-http.entrypoints=http
      - traefik.http.routers.${ROUTER_NAME:-bmapi}-http.middlewares=${ROUTER_NAME:-bmapi}-https
      - traefik.http.routers.${ROUTER_NAME:-bmapi}-http.rule=Host(`${API_HOST:?defina API_HOST}`)
      - traefik.http.routers.${ROUTER_NAME:-bmapi}.entrypoints=https
      - traefik.http.routers.${ROUTER_NAME:-bmapi}.rule=Host(`${API_HOST}`)
      - traefik.http.routers.${ROUTER_NAME:-bmapi}.tls.certresolver=letsencrypt
      - traefik.http.services.${ROUTER_NAME:-bmapi}.loadbalancer.server.port=3000

networks:
  coolify:
    external: true
